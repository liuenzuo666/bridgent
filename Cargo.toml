[package]
name = "bridgent"
version = "0.1.0"
edition = "2021"
description = "Stateless CLI to bridge agent config directories via symlinks and git exclude"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
